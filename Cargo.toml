[package]
name = "fileshred"
version = "0.1.0"
edition = "2021"
authors = ["r3dg0d"]
license = "MIT"
description = "Honest secure-delete — best-effort overwrite with clear limitations for modern storage"
readme = "README.md"
repository = "https://github.com/r3dg0d/fileshred"
keywords = ["secure-delete", "privacy", "shred", "cli", "storage"]
categories = ["command-line-utilities", "filesystem"]
rust-version = "1.75"

[[bin]]
name = "fileshred"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
directories = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ctrlc = "3"
chrono = { version = "0.4", features = ["serde", "clock"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
